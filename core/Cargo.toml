[package]
name = "promptcase-core"
version = "1.0.0"
description = "Promptcase core library — prompt management, linting, search, and git integration"
authors = ["Promptcase Contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
git2 = "0.19"
tiktoken-rs = "0.6"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
