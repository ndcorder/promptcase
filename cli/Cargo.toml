[package]
name = "promptcase-cli"
version = "1.0.0"
description = "Promptcase CLI — manage prompt libraries from the terminal"
authors = ["Promptcase Contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "promptcase-cli"
path = "src/main.rs"

[dependencies]
promptcase-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"
